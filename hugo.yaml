baseURL: 'https://wangshuyi111.github.io/54sy/'
title: '54sy'
locale: 'zh-CN'
hasCJKLanguage: true
enableGitInfo: true

permalinks:
  post: /post/:slug/

ignoreFiles:
  - '\.obsidian'
  - '\.trash'
  - 'moss_model'

outputs:
  home:
    - HTML
    - RSS
    - Algolia

outputFormats:
  Algolia:
    baseName: algolia
    isPlainText: true
    mediaType: application/json
    notAlternative: true

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 1
    endLevel: 4